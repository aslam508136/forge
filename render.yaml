databases:
  - name: ec2forge-db
    plan: free
    databaseName: ec2forge
    user: ec2forge

services:
  - type: web
    name: forge
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: FORGE_KEY
        value: "ec2forgekey12345"
      - key: FORGE_IV
        value: "ec2forgeiv123456"
      - key: DATABASE_URL
        fromDatabase:
          name: ec2forge-db
          property: connectionString
